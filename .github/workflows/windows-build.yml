name: Test and build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build standalone Windows app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TimberbornSaveTool --paths src src/Timberborn_Save_Tool.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: TimberbornSaveTool-Windows
          path: dist/TimberbornSaveTool.exe
          if-no-files-found: error
